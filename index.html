<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16171d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="bread & butter" />
    <title>bread & butter · hospitalist toolkit</title>
    <script>
      // Set data-theme on <html> before render to avoid FOUC.
      (function () {
        try {
          var stored = localStorage.getItem("bb.theme");
          var theme = stored;
          if (!theme || theme === "auto") {
            theme = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "paper"
              : "midnight";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
